- We switched to the AdvancedInstaller installation system, now we're using Inno Setup again.
- The JRE 8+ requirement for BetterDevelNext installation has been removed.
- We've added the ability for the program to automatically download and install updates (P.S. Both operations require confirmation).
- We've added the ability for the program to automatically check and update system components.
- We've removed the need for information forms and switched to using Toaster.
- We've added a package manager.
- We've switched to using bbruntime (instead of built-in Java).
- We've changed the behavior of the BetterDevelNext loader.
- We've added a Java check.
- We've added a cleanup manager for improved program performance.
- We've fixed an issue with long program shutdowns.
- We've removed the Ukrainian language, and its support is no longer available.
- We've updated the English and Russian language versions.
- Reduced disk space usage
