name: 🐛 Bug report
description: Something in FlaxyIDE is broken or not working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! The more detail you give, the faster it can be fixed.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues and this bug has not been reported yet.
          required: true
        - label: I am using the latest release of FlaxyIDE.
          required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and short description of the bug.
      placeholder: When I click "Build", the IDE freezes...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we trigger the bug ourselves?
      placeholder: |
        1. Create a new project
        2. Add a button to the form
        3. Press Build
        4. See the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - Code editor
        - Visual designer
        - Project manager
        - Build / compilation
        - Installer
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: FlaxyIDE version
      placeholder: e.g. 1.2.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 23H2
    validations:
      required: true

  - type: dropdown
    id: bbruntime
    attributes:
      label: Is bbruntime installed?
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Error messages or logs
      description: Paste any error text here. It will be formatted as code automatically.
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop images or screen recordings here.
